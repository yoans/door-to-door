<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1410" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wagon" />
    <title>Wagon Popcorn — Timberview &amp; Blooming Heights</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="pop">🍿</span>
          <div>
            <h1>Wagon Popcorn</h1>
            <p>Timberview &amp; Blooming Heights</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="locateBtn" class="icon-btn" type="button" aria-label="My location">
            ◎
          </button>
          <button id="menuBtn" class="icon-btn" type="button" aria-label="More">
            ⋯
          </button>
        </div>
      </header>

      <div id="stats" class="stats" aria-live="polite"></div>

      <div class="filters" id="filters" role="tablist" aria-label="Filter houses">
        <button class="chip active" data-filter="all" type="button">All</button>
        <button class="chip" data-filter="unvisited" type="button">Still out</button>
        <button class="chip" data-filter="callback" type="button">Come back</button>
        <button class="chip" data-filter="bought" type="button">Bought</button>
        <button class="chip" data-filter="no" type="button">No</button>
      </div>

      <div id="map" role="application" aria-label="Neighborhood map"></div>

      <div id="legend" class="legend">
        <span><i class="swatch unanswered"></i> Open</span>
        <span><i class="swatch answered"></i> Answered</span>
        <span><i class="swatch bought"></i> Bought</span>
        <span><i class="swatch no"></i> No</span>
        <span><i class="swatch not_home"></i> Not home</span>
      </div>
    </div>

    <div id="sheetBackdrop" class="backdrop hidden"></div>
    <aside id="sheet" class="sheet hidden" aria-hidden="true">
      <div class="handle"></div>
      <div class="sheet-head">
        <div>
          <h2 id="sheetTitle">House</h2>
          <p id="sheetSub">Tap a status</p>
        </div>
        <button id="sheetClose" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>
      <div class="status-grid">
        <button class="status-btn unanswered" data-status="unvisited" type="button">
          <b>Open</b>
          <span>not visited</span>
        </button>
        <button class="status-btn answered" data-status="answered" type="button">
          <b>Answered</b>
          <span>talked, maybe later</span>
        </button>
        <button class="status-btn bought" data-status="bought" type="button">
          <b>Bought</b>
          <span>sale</span>
        </button>
        <button class="status-btn no" data-status="no" type="button">
          <b>No</b>
          <span>not interested</span>
        </button>
        <button class="status-btn not_home" data-status="not_home" type="button">
          <b>Not home</b>
          <span>come back</span>
        </button>
      </div>
      <label class="note-label" for="noteInput">Note</label>
      <textarea id="noteInput" rows="2" placeholder="Gate code, come back after dinner…"></textarea>
    </aside>

    <aside id="menuPanel" class="drawer hidden" aria-hidden="true">
      <div class="drawer-head">
        <div>
          <h2>Route</h2>
          <p>Saved in this browser. Copy a link to hand off to another phone.</p>
        </div>
        <button id="menuClose" class="icon-btn" type="button" aria-label="Close menu">✕</button>
      </div>
      <div class="menu-actions">
        <button id="shareBtn" type="button">Copy share link</button>
        <button id="exportBtn" type="button">Download backup</button>
        <button id="resetBtn" class="danger" type="button">Reset all houses</button>
      </div>
    </aside>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
